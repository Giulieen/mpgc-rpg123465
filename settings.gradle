/*
 * Il progetto richiede Java 21. Senza questo plugin Gradle cerca il JDK 21
 * soltanto fra quelli gia' installati e, se non lo trova, si ferma: il
 * progetto non sarebbe compilabile "da qualsiasi computer" come richiesto.
 * Con il resolver, Gradle lo scarica da solo alla prima compilazione.
 */
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'tower-of-self-rpg'
