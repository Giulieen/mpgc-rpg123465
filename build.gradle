plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'it.unicam.cs.mpgc.rpg123465'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.1'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Da Gradle 9 il launcher della piattaforma JUnit non viene piu' aggiunto
    // implicitamente al classpath di prova: senza questa riga i test non partono.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// I sorgenti contengono testi italiani accentati: senza questa riga
// l'encoding dipenderebbe dalla codepage della macchina che compila,
// e un disallineamento non produce errori ma stringhe illeggibili.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

javafx {
    version = '25'
    modules = ['javafx.controls', 'javafx.media']
}

application {
    mainClass = 'it.unicam.cs.mpgc.rpg123465.MainApp'
}

test {
    useJUnitPlatform()
}

/*
 * Il Javadoc viene controllato per intero tranne la categoria "missing".
 *
 * I tag presenti devono essere corretti e completi — un @param che non
 * corrisponde al parametro, o un @return mancante dove il metodo restituisce
 * qualcosa, è un difetto e fa rumore in questo controllo.
 *
 * Non viene invece preteso un commento su ogni membro pubblico: documentare
 * costanti come UP e DOWN aggiungerebbe righe che ripetono il nome senza
 * spiegare nulla, ed è esattamente il commento inutile che il Clean Code
 * invita a evitare.
 */
tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}
